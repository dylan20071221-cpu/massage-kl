<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>大马顶级会所，顶级水疗</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F0A1A" />
  <style>
    html, body { overflow-y: auto !important; height: auto !important; min-height: 100vh; }
    .explore-page {
      background: var(--bg);
      min-height: 100vh;
      overflow-y: auto;
      padding-bottom: 40px;
    }
    .explore-header {
      padding: 60px 20px 20px;
      background: linear-gradient(180deg, rgba(139,92,246,0.2), transparent);
    }
    .explore-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .explore-header p {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .explore-banner {
      margin: 6px 16px 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(236,72,153,0.1));
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-light);
      display: none;
    }
    .explore-banner .banner-contact {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .explore-banner .banner-contact a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .explore-banner .banner-contact a:hover { opacity: 0.8; }
    .explore-banner .banner-contact .wa-btn {
      background: #25D366;
      color: white;
    }
    .explore-banner .banner-contact .tg-btn {
      background: #0088cc;
      color: white;
    }
    .explore-search {
      padding: 0 16px;
      margin: -10px auto 12px;
      position: relative;
    }
    .explore-search input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: white;
      font-size: 0.95rem;
      font-family: var(--font);
      outline: none;
    }
    .explore-search input:focus {
      border-color: var(--primary);
    }
    .explore-search-icon {
      position: absolute;
      left: 32px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.4;
      pointer-events: none;
    }
    .explore-filters {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      margin-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .explore-filters::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-light);
      font-size: 0.82rem;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .grid-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    .grid-card:active { transform: scale(0.97); }
    .grid-card-cover {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
    }
    .grid-photo-nav { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
    .grid-photo-arrow { width:30px; height:50px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:rgba(255,255,255,0.6); background:rgba(0,0,0,0.15); cursor:pointer; pointer-events:auto; user-select:none; opacity:0; transition:all 0.2s; }
    .grid-card-cover:hover .grid-photo-arrow { opacity:1; }
    .grid-photo-arrow.left { border-radius:0 6px 6px 0; }
    .grid-photo-arrow.right { border-radius:6px 0 0 6px; }
    .grid-photo-arrow:hover { background:rgba(0,0,0,0.4); color:white; }
    .grid-card-body { padding: 14px 16px; }
    .grid-card-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .grid-card-name { font-weight: 700; font-size: 1rem; }
    .grid-card-age { color: var(--text-light); font-size: 0.85rem; }
    .grid-card-area { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
    .grid-card-bodyinfo { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; display:flex; gap:6px; flex-wrap:wrap; }
    .grid-card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .grid-card-tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(139,92,246,0.12);
      color: var(--primary-light);
    }
    .grid-card-bottom {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .grid-card-price { font-weight: 700; color: var(--accent); font-size: 0.95rem; }
    .grid-card-rating { color: var(--rating); font-size: 0.85rem; }
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      padding: 0 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .explore-back {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
  </style>
</head>
<body>
  <button class="explore-back" onclick="history.back()">←</button>
  <div class="explore-page">
    <div class="explore-header">
      <h1>📋 浏览</h1>
      <p id="exploreSubtitle">找到你喜欢的技师</p>
    </div>
    <div style="display:flex;gap:0;padding:0 16px 8px;justify-content:center;">
      <span class="mode-tab active" onclick="event.preventDefault()" style="cursor:default;">💆 按摩</span>
    </div>
    <div class="explore-banner" id="exploreBanner"></div>
    <div class="explore-search">
      <span class="explore-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索名字、区域…" oninput="searchTechs()" />
    </div>
    <div class="explore-filters" id="filterBar">
      <button class="filter-chip active" data-area="all" onclick="filterGrid('all')">全部</button>
    </div>
    <div class="explore-grid" id="exploreGrid">
      <div style="text-align:center;padding:40px;color:var(--text-light);">加载中…</div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
