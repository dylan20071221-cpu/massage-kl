<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>懂懂的管理后台</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F0A1A" />
</head>
<body>

  <div class="admin-header">
    <h1>🦀 <span>懂懂</span> 的管理后台</h1>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="previewData()">👁 预览数据</button>
      <button class="btn btn-success" onclick="exportData()">📥 导出 data.js</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('config')">⚙️ 网站设置</button>
    <button class="tab" onclick="switchTab('techs')">👩‍⚕️ 技师管理</button>
    <button class="tab" onclick="switchTab('analytics')">📊 实时流量</button>
  </div>

  <!-- Tab: Config -->
  <div class="tab-content active" id="tab-config">
    <div class="config-grid" id="configEditor">
      <div class="config-field">
        <label>网站名称</label>
        <input type="text" id="cfg-siteName" />
      </div>
      <div class="config-field">
        <label>标语</label>
        <input type="text" id="cfg-tagline" />
      </div>
      <div class="config-field">
        <label>WhatsApp 号码 <span style="color:var(--admin-danger);">*</span></label>
        <input type="text" id="cfg-whatsapp" />
      </div>
      <div class="config-field">
        <label>Telegram 用户名</label>
        <input type="text" id="cfg-telegram" placeholder="如：my_massage_bot" />
      </div>
      <div class="config-field">
        <label>服务区域（逗号分隔）</label>
        <textarea id="cfg-areas" rows="2"></textarea>
      </div>
    </div>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" onclick="saveConfig()">💾 保存设置</button>
    </div>
  </div>

  <!-- Tab: Technicians -->
  <div class="tab-content" id="tab-techs">
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
      <button class="btn btn-primary" onclick="addTechnician()">➕ 添加新技师</button>
      <span style="font-size:0.8rem;color:var(--admin-muted);" id="techCount"></span>
    </div>
    <div class="tech-grid" id="techList"></div>
  </div>

  <!-- Tab: Analytics -->
  <div class="tab-content" id="tab-analytics">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-size:1.2rem;">📊 实时流量</h2>
      <span id="analytics-status" style="font-size:0.8rem;color:var(--admin-muted);">⏳ 加载中...</span>
    </div>
    <div id="analyticsIframeContainer" style="width:100%;min-height:500px;background:var(--admin-card);border-radius:12px;border:1px solid var(--admin-border);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:40px;">
      <div style="font-size:3rem;">📊</div>
      <div style="color:var(--admin-muted);text-align:center;font-size:0.9rem;">
        <p>Umami 数据库配置好后即可查看实时流量</p>
        <p style="margin-top:8px;">请先在 Umami 后台创建站点并获取 Website ID</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
