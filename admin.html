<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>管理后台 - 按按摩</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --admin-bg: #0f0f1a;
      --admin-card: #1a1a2e;
      --admin-border: #2a2a4a;
      --admin-primary: #8b5cf6;
      --admin-accent: #f59e0b;
      --admin-danger: #ef4444;
      --admin-success: #22c55e;
      --admin-text: #e2e8f0;
      --admin-muted: #94a3b8;
      --admin-input: #1e1e36;
    }
    body {
      background: var(--admin-bg);
      color: var(--admin-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--admin-border);
    }
    .admin-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
    .admin-header h1 span { color: var(--admin-primary); }
    .header-actions { display: flex; gap: 8px; }
    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--admin-primary); color: white; }
    .btn-primary:hover { background: #7c3aed; }
    .btn-success { background: var(--admin-success); color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-danger { background: var(--admin-danger); color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--admin-border);
      color: var(--admin-text);
    }
    .btn-outline:hover { border-color: var(--admin-primary); color: var(--admin-primary); }
    .btn-sm { padding: 5px 12px; font-size: 0.78rem; }

    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab {
      padding: 10px 20px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--admin-muted);
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      font-family: inherit;
    }
    .tab.active {
      color: white;
      background: var(--admin-card);
      border-color: var(--admin-border);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Site Config */
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 800px;
    }
    .config-field { margin-bottom: 4px; }
    .config-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--admin-muted);
      margin-bottom: 4px;
    }
    .config-field input, .config-field textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--admin-input);
      border: 1px solid var(--admin-border);
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }
    .config-field input:focus, .config-field textarea:focus {
      border-color: var(--admin-primary);
    }
    .config-field textarea { resize: vertical; min-height: 60px; }

    /* Technician Cards */
    .tech-grid { display: grid; gap: 16px; }
    .tech-card {
      background: var(--admin-card);
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
    }
    .tech-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .tech-card-header:hover { background: rgba(139,92,246,0.05); }
    .tech-card-title { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; }
    .tech-card-title .area-tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(139,92,246,0.15);
      color: var(--admin-primary);
      font-weight: 400;
    }
    .tech-card-toggle { font-size: 0.8rem; color: var(--admin-muted); }
    .tech-card-body {
      padding: 0 18px 18px;
      display: none;
    }
    .tech-card-body.open { display: block; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-row-2 { grid-template-columns: 1fr 1fr; }
    .form-row-full { grid-template-columns: 1fr; }

    .field-group { margin-bottom: 4px; }
    .field-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--admin-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field-group input, .field-group textarea, .field-group select {
      width: 100%;
      padding: 8px 10px;
      background: var(--admin-input);
      border: 1px solid var(--admin-border);
      border-radius: 5px;
      color: white;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
    }
    .field-group input:focus, .field-group textarea:focus, .field-group select:focus {
      border-color: var(--admin-primary);
    }
    .field-group textarea { resize: vertical; min-height: 50px; }

    .services-editor, .reviews-editor {
      margin-top: 8px;
    }
    .services-editor .item-row, .reviews-editor .item-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }
    .services-editor .item-row input, .reviews-editor .item-row input {
      flex: 1;
      padding: 6px 8px;
      background: var(--admin-input);
      border: 1px solid var(--admin-border);
      border-radius: 4px;
      color: white;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
    }
    .services-editor .item-row input:focus, .reviews-editor .item-row input:focus {
      border-color: var(--admin-primary);
    }
    .services-editor .item-row .item-price {
      max-width: 90px;
    }
    .reviews-editor .item-row .item-rating {
      max-width: 60px;
    }
    .item-remove {
      background: none;
      border: none;
      color: var(--admin-danger);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      opacity: 0.6;
    }
    .item-remove:hover { opacity: 1; }
    .item-add {
      margin-top: 4px;
      background: none;
      border: 1px dashed var(--admin-border);
      color: var(--admin-muted);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: inherit;
    }
    .item-add:hover { border-color: var(--admin-primary); color: var(--admin-primary); }

    .specialties-editor {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 0;
    }
    .spec-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(139,92,246,0.12);
      color: var(--admin-primary);
      font-size: 0.78rem;
    }
    .spec-tag .spec-remove {
      cursor: pointer;
      opacity: 0.5;
      font-size: 0.9rem;
    }
    .spec-tag .spec-remove:hover { opacity: 1; }
    .spec-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .spec-input-row input {
      padding: 6px 10px;
      background: var(--admin-input);
      border: 1px solid var(--admin-border);
      border-radius: 4px;
      color: white;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      width: 160px;
    }
    .spec-input-row input:focus { border-color: var(--admin-primary); }

    .tech-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--admin-border);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--admin-card);
      border: 1px solid var(--admin-primary);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .config-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr 1fr; }
      body { padding: 12px; }
    }
  </style>
</head>
<body>

  <div class="admin-header">
    <h1>🦀 <span>按按摩</span> 管理后台</h1>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="previewData()">👁 预览数据</button>
      <button class="btn btn-success" onclick="exportData()">📥 导出 data.js</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('config')">⚙️ 网站设置</button>
    <button class="tab" onclick="switchTab('techs')">👩‍⚕️ 技师管理</button>
  </div>

  <!-- Tab: Config -->
  <div class="tab-content active" id="tab-config">
    <div class="config-grid" id="configEditor">
      <div class="config-field">
        <label>网站名称</label>
        <input type="text" id="cfg-siteName" />
      </div>
      <div class="config-field">
        <label>标语</label>
        <input type="text" id="cfg-tagline" />
      </div>
      <div class="config-field">
        <label>WhatsApp 号码 <span style="color:var(--admin-danger);">*</span></label>
        <input type="text" id="cfg-whatsapp" />
      </div>
      <div class="config-field">
        <label>服务区域（逗号分隔）</label>
        <textarea id="cfg-areas" rows="2"></textarea>
      </div>
    </div>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" onclick="saveConfig()">💾 保存设置</button>
    </div>
  </div>

  <!-- Tab: Technicians -->
  <div class="tab-content" id="tab-techs">
    <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
      <button class="btn btn-primary" onclick="addTechnician()">➕ 添加新技师</button>
      <span style="font-size:0.8rem;color:var(--admin-muted);" id="techCount"></span>
    </div>
    <div class="tech-grid" id="techList"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== Data =====
    let data = {
      siteName: "按按摩",
      tagline: "大马正规按摩 · 上门预约",
      whatsappNumber: "601114155848",
      areas: ["吉隆坡", "Cheras", "Puchong", "Kajang", "Setapak", "Subang", "Petaling Jaya", "Ampang"],
      technicians: [
        { id: 1, name: "小玲", age: 28, area: "Cheras", coverBg: "linear-gradient(135deg, #667eea, #764ba2)", specialties: ["泰式按摩", "肩颈理疗", "精油推拿"], rating: 4.8, reviewCount: 126, price: "RM 90/小时", phone: "601114155848", available: true, experience: "8年经验", height: "162cm", weight: "52kg", bio: "精通泰式古法按摩，擅长肩颈放松和全身拉伸。上门服务态度好，准时守约，顾客回头率极高。", serviceRange: "Cheras及周边5公里", services: [{name:"泰式按摩（1小时）",price:"RM 90"},{name:"肩颈理疗（45分钟）",price:"RM 70"},{name:"全身精油推拿（1.5小时）",price:"RM 130"}], reviews: [{user:"匿名用户",rating:5,text:"手法很好，按完整个人都松了"},{user:"Alex",rating:5,text:"准时上门，态度好，推荐！"}] },
        { id: 2, name: "小美", age: 26, area: "Puchong", coverBg: "linear-gradient(135deg, #f093fb, #f5576c)", specialties: ["精油推拿", "脚底按摩", "淋巴排毒"], rating: 4.6, reviewCount: 98, price: "RM 80/小时", phone: "601114155848", available: true, experience: "5年经验", height: "158cm", weight: "48kg", bio: "专精精油推拿和脚底穴位按摩，手法温柔细腻，第一次做按摩的客人都很喜欢。", serviceRange: "Puchong及附近", services: [{name:"精油推拿（1小时）",price:"RM 80"},{name:"脚底按摩（45分钟）",price:"RM 60"},{name:"淋巴排毒（1.5小时）",price:"RM 120"}], reviews: [{user:"Ken",rating:5,text:"小美人很温柔，按得很舒服"},{user:"薇薇",rating:4,text:"手法不错，推荐"}] },
        { id: 3, name: "丽丽", age: 32, area: "吉隆坡", coverBg: "linear-gradient(135deg, #4facfe, #00f2fe)", specialties: ["传统马来按摩", "产后修复", "全身拉伸"], rating: 4.9, reviewCount: 203, price: "RM 100/小时", phone: "601114155848", available: true, experience: "12年经验", height: "165cm", weight: "55kg", bio: "资深按摩师，专长传统马来按摩和产后修复。手法老道、力道精准，很多老顾客跟了她好几年。", serviceRange: "吉隆坡市区", services: [{name:"传统马来按摩（1小时）",price:"RM 100"},{name:"产后修复（1.5小时）",price:"RM 150"},{name:"全身拉伸放松（1小时）",price:"RM 90"}], reviews: [{user:"江先生",rating:5,text:"做了半年多的老顾客了"},{user:"May",rating:5,text:"产后恢复得很好"}] },
        { id: 4, name: "小花", age: 27, area: "Kajang", coverBg: "linear-gradient(135deg, #a18cd1, #fbc2eb)", specialties: ["中式推拿", "拔罐刮痧", "穴位按摩"], rating: 4.7, reviewCount: 75, price: "RM 85/小时", phone: "601114155848", available: true, experience: "7年经验", height: "160cm", weight: "50kg", bio: "正宗中式推拿手法，兼修拔罐刮痧。擅长缓解肌肉酸痛，常年坐办公室的最爱。", serviceRange: "Kajang及周边", services: [{name:"中式推拿（1小时）",price:"RM 85"},{name:"拔罐刮痧（45分钟）",price:"RM 65"},{name:"综合理疗（1.5小时）",price:"RM 120"}], reviews: [{user:"程序员小王",rating:5,text:"肩膀终于不酸了"},{user:"Lisa",rating:4,text:"拔罐力度刚好"}] },
        { id: 5, name: "Yuki", age: 25, area: "Setapak", coverBg: "linear-gradient(135deg, #fccb90, #d57eeb)", specialties: ["日式指压", "头部SPA", "香薰按摩"], rating: 4.5, reviewCount: 62, price: "RM 95/小时", phone: "601114155848", available: true, experience: "4年经验", height: "156cm", weight: "46kg", bio: "日式指压技法，配合头部SPA和芳香疗法。年轻有活力，服务态度超好。", serviceRange: "Setapak / Wangsa Maju", services: [{name:"日式指压（1小时）",price:"RM 95"},{name:"头部SPA（45分钟）",price:"RM 75"},{name:"香薰放松套餐（1.5小时）",price:"RM 140"}], reviews: [{user:"Eric",rating:5,text:"头部SPA太舒服了"}] },
        { id: 6, name: "阿May", age: 34, area: "Subang", coverBg: "linear-gradient(135deg, #5ee7df, #b490ca)", specialties: ["泰式按摩", "热石理疗", "深层组织"], rating: 4.8, reviewCount: 154, price: "RM 110/小时", phone: "601114155848", available: true, experience: "10年经验", height: "163cm", weight: "54kg", bio: "泰式按摩和热石理疗，手法有力到位。常年肌肉酸痛的朋友找她准没错。", serviceRange: "Subang / USJ", services: [{name:"泰式按摩（1小时）",price:"RM 110"},{name:"热石理疗（1.5小时）",price:"RM 160"},{name:"深层组织放松（2小时）",price:"RM 200"}], reviews: [{user:"阿Ben",rating:5,text:"May姐力度够"}] },
        { id: 7, name: "小玉", age: 29, area: "Petaling Jaya", coverBg: "linear-gradient(135deg, #fa709a, #fee140)", specialties: ["泰式按摩", "精油推拿"], rating: 4.7, reviewCount: 88, price: "RM 85/小时", phone: "601114155848", available: true, experience: "6年经验", height: "160cm", weight: "51kg", bio: "热情开朗，手法灵活多变，根据客人身体状况调整。", serviceRange: "PJ / Damansara", services: [{name:"泰式按摩（1小时）",price:"RM 85"},{name:"精油推拿（1小时）",price:"RM 85"},{name:"全身放松（1.5小时）",price:"RM 120"}], reviews: [{user:"David",rating:5,text:"小玉很专业"}] },
        { id: 8, name: "Coco", age: 24, area: "Cheras", coverBg: "linear-gradient(135deg, #ffecd2, #fcb69f)", specialties: ["精油推拿", "香薰SPA", "热石"], rating: 4.4, reviewCount: 45, price: "RM 95/小时", phone: "601114155848", available: true, experience: "3年经验", height: "165cm", weight: "50kg", bio: "年轻时尚，擅长精油推拿和香薰SPA。手法温柔细腻。", serviceRange: "Cheras", services: [{name:"精油推拿（1小时）",price:"RM 95"},{name:"香薰SPA（1.5小时）",price:"RM 140"},{name:"热石放松（1小时）",price:"RM 100"}], reviews: [{user:"阿杰",rating:5,text:"Coco环境香香的"}] },
      ]
    };

    // ===== State =====
    let nextId = 9;
    let currentTab = 'config';

    // ===== Tab =====
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='config')||(i===1&&tab==='techs')));
      document.getElementById('tab-config').classList.toggle('active', tab === 'config');
      document.getElementById('tab-techs').classList.toggle('active', tab === 'techs');
      if (tab === 'config') loadConfig();
      if (tab === 'techs') renderTechs();
    }

    // ===== Config =====
    function loadConfig() {
      document.getElementById('cfg-siteName').value = data.siteName;
      document.getElementById('cfg-tagline').value = data.tagline;
      document.getElementById('cfg-whatsapp').value = data.whatsappNumber;
      document.getElementById('cfg-areas').value = data.areas.join(', ');
    }

    function saveConfig() {
      data.siteName = document.getElementById('cfg-siteName').value.trim();
      data.tagline = document.getElementById('cfg-tagline').value.trim();
      data.whatsappNumber = document.getElementById('cfg-whatsapp').value.trim();
      data.areas = document.getElementById('cfg-areas').value.split(/[,，\s]+/).filter(Boolean);
      showToast('✅ 网站设置已保存');
    }

    // ===== Technicians =====
    function renderTechs() {
      const list = document.getElementById('techList');
      list.innerHTML = '';
      data.technicians.forEach((t, idx) => {
        const card = document.createElement('div');
        card.className = 'tech-card';
        card.innerHTML = `
          <div class="tech-card-header" onclick="toggleCard(${idx})">
            <div class="tech-card-title">
              #${t.id} ${t.name}
              <span class="area-tag">${t.area}</span>
              <span style="font-size:0.78rem;color:var(--admin-muted);font-weight:400;">${t.price}</span>
            </div>
            <span class="tech-card-toggle" id="toggle-${idx}">▼</span>
          </div>
          <div class="tech-card-body" id="cardBody-${idx}">
            <div class="form-row">
              <div class="field-group">
                <label>名字</label>
                <input type="text" value="${escHtml(t.name)}" onchange="updateField(${idx},'name',this.value)" />
              </div>
              <div class="field-group">
                <label>年龄</label>
                <input type="number" value="${t.age}" onchange="updateField(${idx},'age',parseInt(this.value)||0)" />
              </div>
              <div class="field-group">
                <label>区域</label>
                <input type="text" value="${escHtml(t.area)}" onchange="updateField(${idx},'area',this.value)" />
              </div>
            </div>
            <div class="form-row">
              <div class="field-group">
                <label>价格</label>
                <input type="text" value="${escHtml(t.price)}" onchange="updateField(${idx},'price',this.value)" />
              </div>
              <div class="field-group">
                <label>评分</label>
                <input type="number" step="0.1" min="0" max="5" value="${t.rating}" onchange="updateField(${idx},'rating',parseFloat(this.value)||0)" />
              </div>
              <div class="field-group">
                <label>评价数</label>
                <input type="number" value="${t.reviewCount}" onchange="updateField(${idx},'reviewCount',parseInt(this.value)||0)" />
              </div>
            </div>
            <div class="form-row">
              <div class="field-group">
                <label>电话</label>
                <input type="text" value="${escHtml(t.phone)}" onchange="updateField(${idx},'phone',this.value)" />
              </div>
              <div class="field-group">
                <label>状态</label>
                <select onchange="updateField(${idx},'available',this.value==='true')">
                  <option value="true" ${t.available?'selected':''}>可预约</option>
                  <option value="false" ${!t.available?'selected':''}>暂停</option>
                </select>
              </div>
              <div class="field-group">
                <label>渐变背景色（CSS）</label>
                <input type="text" value="${escHtml(t.coverBg)}" onchange="updateField(${idx},'coverBg',this.value)" />
              </div>
            </div>
            <div class="form-row form-row-2">
              <div class="field-group">
                <label>经验</label>
                <input type="text" value="${escHtml(t.experience||'')}" onchange="updateField(${idx},'experience',this.value)" />
              </div>
              <div class="field-group">
                <label>身高 / 体重</label>
                <div style="display:flex;gap:8px;">
                  <input type="text" value="${escHtml(t.height||'')}" placeholder="身高" onchange="updateField(${idx},'height',this.value)" style="flex:1;" />
                  <input type="text" value="${escHtml(t.weight||'')}" placeholder="体重" onchange="updateField(${idx},'weight',this.value)" style="flex:1;" />
                </div>
              </div>
            </div>
            <div class="form-row form-row-full">
              <div class="field-group">
                <label>个人简介</label>
                <textarea rows="3" onchange="updateField(${idx},'bio',this.value)">${escHtml(t.bio||'')}</textarea>
              </div>
            </div>
            <div class="form-row form-row-full">
              <div class="field-group">
                <label>服务范围</label>
                <input type="text" value="${escHtml(t.serviceRange||'')}" onchange="updateField(${idx},'serviceRange',this.value)" />
              </div>
            </div>

            <!-- Specialties -->
            <div class="field-group" style="margin-top:8px;">
              <label>专长标签</label>
              <div class="specialties-editor" id="specs-${idx}"></div>
              <div class="spec-input-row">
                <input type="text" id="specInput-${idx}" placeholder="输入新专长" onkeydown="if(event.key==='Enter'){event.preventDefault();addSpecialty(${idx})}" />
                <button class="btn btn-primary btn-sm" onclick="addSpecialty(${idx})">添加</button>
              </div>
            </div>

            <!-- Services -->
            <div class="field-group" style="margin-top:12px;">
              <label>服务项目与价格</label>
              <div class="services-editor" id="services-${idx}"></div>
              <button class="item-add" onclick="addService(${idx})">➕ 添加服务项目</button>
            </div>

            <!-- Reviews -->
            <div class="field-group" style="margin-top:12px;">
              <label>顾客评价</label>
              <div class="reviews-editor" id="reviews-${idx}"></div>
              <button class="item-add" onclick="addReview(${idx})">➕ 添加评价</button>
            </div>

            <div class="tech-card-actions">
              <button class="btn btn-danger btn-sm" onclick="deleteTechnician(${idx})">🗑 删除此技师</button>
            </div>
          </div>
        `;
        list.appendChild(card);
        renderSpecialties(idx);
        renderServices(idx);
        renderReviews(idx);
      });
      document.getElementById('techCount').textContent = `共 ${data.technicians.length} 位技师`;
    }

    function toggleCard(idx) {
      const body = document.getElementById(`cardBody-${idx}`);
      const toggle = document.getElementById(`toggle-${idx}`);
      body.classList.toggle('open');
      toggle.textContent = body.classList.contains('open') ? '▲' : '▼';
    }

    function updateField(idx, key, value) {
      data.technicians[idx][key] = value;
    }

    function renderSpecialties(idx) {
      const el = document.getElementById(`specs-${idx}`);
      if (!el) return;
      const t = data.technicians[idx];
      el.innerHTML = t.specialties.map((s, si) =>
        `<span class="spec-tag">${escHtml(s)} <span class="spec-remove" onclick="removeSpecialty(${idx},${si})">✕</span></span>`
      ).join('');
    }

    function addSpecialty(idx) {
      const input = document.getElementById(`specInput-${idx}`);
      const val = input.value.trim();
      if (!val) return;
      data.technicians[idx].specialties.push(val);
      input.value = '';
      renderSpecialties(idx);
    }

    function removeSpecialty(idx, si) {
      data.technicians[idx].specialties.splice(si, 1);
      renderSpecialties(idx);
    }

    function renderServices(idx) {
      const el = document.getElementById(`services-${idx}`);
      if (!el) return;
      const t = data.technicians[idx];
      el.innerHTML = t.services.map((s, si) =>
        `<div class="item-row">
          <input type="text" value="${escHtml(s.name)}" placeholder="服务名称" onchange="updateService(${idx},${si},'name',this.value)" />
          <input type="text" class="item-price" value="${escHtml(s.price)}" placeholder="价格" onchange="updateService(${idx},${si},'price',this.value)" />
          <button class="item-remove" onclick="removeService(${idx},${si})">✕</button>
        </div>`
      ).join('');
    }

    function updateService(idx, si, key, value) {
      data.technicians[idx].services[si][key] = value;
    }

    function addService(idx) {
      data.technicians[idx].services.push({ name: "", price: "" });
      renderServices(idx);
    }

    function removeService(idx, si) {
      data.technicians[idx].services.splice(si, 1);
      renderServices(idx);
    }

    function renderReviews(idx) {
      const el = document.getElementById(`reviews-${idx}`);
      if (!el) return;
      const t = data.technicians[idx];
      el.innerHTML = t.reviews.map((r, ri) =>
        `<div class="item-row">
          <input type="text" value="${escHtml(r.user)}" placeholder="评价人" onchange="updateReview(${idx},${ri},'user',this.value)" style="max-width:100px;" />
          <input type="number" class="item-rating" value="${r.rating}" min="1" max="5" placeholder="评分" onchange="updateReview(${idx},${ri},'rating',parseInt(this.value)||5)" />
          <input type="text" value="${escHtml(r.text)}" placeholder="评价内容" onchange="updateReview(${idx},${ri},'text',this.value)" />
          <button class="item-remove" onclick="removeReview(${idx},${ri})">✕</button>
        </div>`
      ).join('');
    }

    function updateReview(idx, ri, key, value) {
      data.technicians[idx].reviews[ri][key] = value;
    }

    function addReview(idx) {
      data.technicians[idx].reviews.push({ user: "", rating: 5, text: "" });
      renderReviews(idx);
    }

    function removeReview(idx, ri) {
      data.technicians[idx].reviews.splice(ri, 1);
      renderReviews(idx);
    }

    function addTechnician() {
      data.technicians.push({
        id: nextId++,
        name: "新技师",
        age: 25,
        area: "吉隆坡",
        coverBg: "linear-gradient(135deg, #667eea, #764ba2)",
        specialties: ["按摩"],
        rating: 4.5,
        reviewCount: 0,
        price: "RM 80/小时",
        phone: "",
        available: true,
        experience: "",
        height: "",
        weight: "",
        bio: "",
        serviceRange: "",
        services: [{ name: "按摩（1小时）", price: "RM 80" }],
        reviews: []
      });
      renderTechs();
      showToast('✅ 已添加新技师');
    }

    function deleteTechnician(idx) {
      if (!confirm(`确定删除 ${data.technicians[idx].name} 吗？`)) return;
      data.technicians.splice(idx, 1);
      renderTechs();
      showToast('🗑 已删除');
    }

    // ===== Export =====
    function exportData() {
      // Build the data.js file content
      let areasStr = JSON.stringify(data.areas, null, 2);
      let techsStr = JSON.stringify(data.technicians.map(t => {
        // Reorder fields for cleaner output
        const {id, name, age, area, coverBg, specialties, rating, reviewCount, price, phone, available, experience, height, weight, bio, serviceRange, services, reviews} = t;
        return {id, name, age, area, coverBg, specialties, rating, reviewCount, price, phone, available, experience, height, weight, bio, serviceRange, services, reviews};
      }), null, 2);

      const output = `/**
 * 🦀 按按摩 - 技师数据
 * 由管理后台生成 — 改这个文件就行
 */

const SITE_CONFIG = {
  siteName: ${JSON.stringify(data.siteName)},
  tagline: ${JSON.stringify(data.tagline)},
  whatsappNumber: "${data.whatsappNumber}",
  areas: ${areasStr},
};

const technicians = ${techsStr};

// ===== 工具函数 =====
function getTechnicianById(id) {
  return technicians.find(t => t.id === parseInt(id));
}
function getAllAreas() {
  return [...new Set(technicians.map(t => t.area))];
}
function getTechniciansByArea(area) {
  if (!area || area === "all") return technicians;
  return technicians.filter(t => t.area === area);
}
`;

      const blob = new Blob([output], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📥 data.js 已下载，替换 massage-kl/js/data.js 即可');
    }

    function previewData() {
      const w = window.open('', '_blank');
      w.document.write('<html><head><title>数据预览</title><style>body{background:#0f0f1a;color:#e2e8f0;font-family:monospace;padding:20px;white-space:pre-wrap;font-size:13px;line-height:1.5;}h2{color:#8b5cf6;}hr{border-color:#2a2a4a;}</style></head><body>');
      w.document.write('<h2>📋 SITE_CONFIG</h2>');
      w.document.write(JSON.stringify({siteName:data.siteName,tagline:data.tagline,whatsappNumber:data.whatsappNumber,areas:data.areas}, null, 2));
      w.document.write('<hr><h2>👩‍⚕️ Technicians (' + data.technicians.length + ')</h2>');
      data.technicians.forEach((t, i) => {
        w.document.write(`<h3 style="color:#f59e0b;">#${t.id} ${t.name} (${t.area}) - ${t.price}</h3>`);
        w.document.write(JSON.stringify(t, null, 2) + '\n\n');
      });
      w.document.write('</body></html>');
      w.document.close();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ===== Init =====
    loadConfig();
  </script>
</body>
</html>
