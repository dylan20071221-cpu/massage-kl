<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>🧧 红包局 - 陪酒</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/red-packet.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F0A1A" />
</head>
<body>
  <div class="app" id="app">
    <!-- 状态栏 -->
    <div class="rp-status-bar">
      <span class="logo">🧧 红包局</span>
      <div class="rp-status-icons">
        <button class="rp-view-toggle" onclick="toggleView()" title="切换视图">📋</button>
      </div>
    </div>

    <!-- 筛选导航 -->
    <div class="rp-nav">
      <span class="rp-nav-item" data-mode="all" onclick="filterByMode('all')">🔥 全部</span>
      <span class="rp-nav-item" data-mode="陪酒" onclick="filterByMode('陪酒')">🥂 陪酒</span>
      <span class="rp-nav-item" data-mode="KTV" onclick="filterByMode('KTV')">🎤 KTV</span>
      <span class="rp-nav-item" data-mode="DJ" onclick="filterByMode('DJ')">🎧 DJ</span>
    </div>

    <!-- 滑动卡片区域 -->
    <div class="card-area" id="cardArea">
      <div class="card-stack" id="cardStack">
        <!-- JS 动态渲染 -->
      </div>
    </div>

    <!-- 列表视图 -->
    <div class="rp-list-view" id="listView"></div>

    <!-- 底部操作栏 -->
    <div class="rp-action-bar" id="actionBar">
      <!-- JS 动态渲染 -->
    </div>
  </div>

  <!-- Toast -->
  <div class="rp-toast" id="rpToast"></div>

  <!-- 详情弹窗 -->
  <div class="rp-modal" id="detailModal" style="display:none;">
    <div class="rp-modal-header">
      <h2 id="detailTitle">详情</h2>
      <button class="rp-modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailContent"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/red-packet.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
