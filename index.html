<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>大马顶级会所，顶级水疗</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F0A1A" />
<style>
  .card-photo-nav { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; z-index:5; pointer-events:none; }
  .card-photo-arrow { width:40px; height:60px; display:flex; align-items:center; justify-content:center; font-size:2rem; color:rgba(255,255,255,0.7); background:rgba(0,0,0,0.2); cursor:pointer; pointer-events:auto; user-select:none; transition:all 0.2s; }
  .card-photo-arrow:hover { background:rgba(0,0,0,0.4); color:white; }
  .card-photo-arrow.left { border-radius:0 8px 8px 0; }
  .card-photo-arrow.right { border-radius:8px 0 0 8px; }
  .card-photo-dots { position:absolute; bottom:130px; left:0; right:0; display:flex; justify-content:center; gap:5px; z-index:5; }
  .mode-tabs { display:flex; gap:0; padding:6px 16px 0; justify-content:center; z-index:10; }
  .mode-tab { padding:8px 24px; border-radius:999px; font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.2s; color:var(--text-muted); }
  .mode-tab.active { background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; box-shadow:0 4px 15px rgba(139,92,246,0.3); }
  .mode-tab:not(.active):hover { color:var(--text-light); }
  .card-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35); cursor:pointer; transition:all 0.2s; }
  .card-dot.active { width:18px; border-radius:3px; background:white; }
</style>
</head>
<body>

  <div class="app" id="app">
    <!-- 状态栏 / 模式切换 -->
    <div class="status-bar">
      <span class="logo">🦀 按按摩</span>
      <div class="status-icons">
        <span onclick="window.location.href='chat.html'" style="cursor:pointer;" title="在线咨询">💬</span>
        <span onclick="window.location.href='red-packet.html'" style="cursor:pointer;">🧧</span>
        <span onclick="window.location.href='explore.html'" style="cursor:pointer;">📋</span>
      </div>
    </div>
    <div class="mode-tabs" style="padding:0;">
      <span class="mode-tab active" onclick="event.preventDefault()" style="cursor:default;">💆 按摩</span>
    </div>

    <!-- 滑动卡片区域 -->
    <div class="card-area">
      <div class="card-stack" id="cardStack">
        <!-- JS 动态渲染 -->
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar" id="actionBar">
      <!-- JS 动态渲染 -->
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script>
    // 动态更新标题和logo
    document.title = SITE_CONFIG.siteName + ' - ' + SITE_CONFIG.tagline;
    const logo = document.querySelector('.logo');
    if (logo) logo.textContent = '🦀 ' + SITE_CONFIG.siteName;
  </script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
