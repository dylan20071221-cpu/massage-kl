<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>按按摩 - 大马按摩预约</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app" id="app">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="logo">🦀 按按摩</span>
      <div class="status-icons">
        <span onclick="window.location.href='explore.html'" style="cursor:pointer;">📋</span>
        <span style="opacity:0.5;">🔔</span>
      </div>
    </div>

    <!-- 滑动卡片区域 -->
    <div class="card-area">
      <div class="card-stack" id="cardStack">
        <!-- JS 动态渲染 -->
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="action-bar" id="actionBar">
      <!-- JS 动态渲染 -->
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script>
    // 动态更新标题和logo
    document.title = SITE_CONFIG.siteName + ' - ' + SITE_CONFIG.tagline;
    const logo = document.querySelector('.logo');
    if (logo) logo.textContent = '🦀 ' + SITE_CONFIG.siteName;
  </script>
  <script src="js/app.js"></script>
</body>
</html>
